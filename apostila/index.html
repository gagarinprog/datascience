  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function realcar(codigo, lang) {
    const marca = lang === "sql" ? "--" : lang === "json" ? null : "#";
    return codigo.split("\n").map((l) => {
      const e = esc(l);
      if (!marca) return e;
      const i = l.indexOf(marca);
      if (i < 0) return e;
      return esc(l.slice(0, i)) + '<span class="c">' + esc(l.slice(i)) + "</span>";
    }).join("\n");
  }

  const ordem = window.MATERIAS.map((m) => m.sigla);
  const porSigla = Object.fromEntries(window.MATERIAS.map((m) => [m.sigla, m]));

  document.body.insertAdjacentHTML("afterbegin", window.FIG_DEFS);

  let nav = '<div class="marca"><b>Domínio</b><span>Guia das matérias</span></div>';
  ETAPAS.forEach(([nome, siglas]) => {
    nav += `<div class="grupo">${esc(nome)}</div>`;
    siglas.forEach((s) => { nav += `<a href="#${s}"><span class="n">${String(ordem.indexOf(s) + 1).padStart(2, "0")}</span>${esc(porSigla[s].nome)}</a>`; });
  });
  document.getElementById("nav").innerHTML = nav;

  document.getElementById("mapa").innerHTML = ETAPAS.map(([nome, siglas]) =>
    `<div class="etapa"><h3>${esc(nome)}</h3>${siglas.map((s) => `<a href="#${s}"><span class="n">${String(ordem.indexOf(s) + 1).padStart(2, "0")}</span>${esc(porSigla[s].nome)}</a>`).join("")}</div>`).join("");

  const guia = document.getElementById("guia");
  window.MATERIAS.forEach((m, i) => {
    const c = C[m.sigla];
    const topicos = m.modulos.map((mod) => `<li><b>${esc(mod.nome)}</b><span class="conceitos">${mod.conceitos.map(esc).join(" · ")}</span><span class="final"><span>Ao final você consegue:</span> ${esc(mod.dominio.charAt(0).toLowerCase() + mod.dominio.slice(1))}.${LICOES[mod.codigo] ? ` <a href="${LICOES[mod.codigo]}">Abrir a lição ilustrada</a>` : ""}</span></li>`).join("");
    guia.insertAdjacentHTML("beforeend", `
      <section class="secao" id="${m.sigla}" aria-labelledby="t-${m.sigla}">
        <p class="sobretitulo">Matéria ${i + 1} de ${window.MATERIAS.length} · ${m.modulos.length} tópicos</p>
        <h2 id="t-${m.sigla}">${esc(m.nome)}</h2>
        <p class="lede">${esc(c.frase)}</p>
        <figure><div class="rolagem">${window.FIG[m.sigla]()}</div><figcaption>${esc(c.legenda)}</figcaption></figure>
        <h3>Como funciona</h3>
        <div class="prosa">${c.texto.map((p) => `<p>${p}</p>`).join("")}</div>
        <div class="par">
          <div class="cartao"><h3>No dia a dia</h3><p>${esc(c.dia)}</p></div>
          <div class="cartao"><h3>No computador</h3><pre>${realcar(c.codigo, c.lang)}</pre></div>
        </div>
        <h3>Os tópicos, em ordem</h3>
        <ol class="topicos">${topicos}</ol>
        <div class="onde">${c.onde.map(([r, v]) => `<span><b>${esc(r)}:</b> ${esc(v)}</span>`).join("")}</div>
      </section>`);
  });

  const links = [...document.querySelectorAll("#nav a")];
  const observador = new IntersectionObserver((entradas) => {
    entradas.forEach((e) => {
      if (e.isIntersecting) links.forEach((a) => a.classList.toggle("ativo", a.getAttribute("href") === "#" + e.target.id));
    });
  }, { rootMargin: "-20% 0px -70% 0px" });
  document.querySelectorAll(".secao").forEach((s) => observador.observe(s));
})();
</script>
