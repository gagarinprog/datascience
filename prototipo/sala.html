<title>Sala de Programação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible+Next:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: uma sala de programação vista de cima. Cada matéria é uma estação; cada módulo, um bloco na bancada; cada conceito, uma linha de código que acende. Uma tela, uma ação. */
:root{
  --bg:#0b0f1a; --piso:#0f1526; --bancada:#151d33; --borda:#24304f; --borda-forte:#36457a;
  --fg:#eef2ff; --fg2:#9aa6c8; --fg3:#5f6b8f;
  --neon:#4cc9ff; --neon2:#8ee3ff; --verde:#39e58c; --ambar:#ffb547; --rosa:#ff6ea8; --roxo:#9d7bff;
  --f-tit:"Bricolage Grotesque",system-ui,sans-serif; --f-txt:"Atkinson Hyperlegible Next",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-txt);
 background-image:radial-gradient(circle at 20% 0%,rgb(76 201 255/.08),transparent 40%),radial-gradient(circle at 90% 100%,rgb(157 123 255/.08),transparent 45%),linear-gradient(rgb(255 255 255/.025) 1px,transparent 1px),linear-gradient(90deg,rgb(255 255 255/.025) 1px,transparent 1px);background-size:auto,auto,28px 28px,28px 28px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-tit);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5.5vw,44px);line-height:1.05;font-weight:800}
h2{font-size:clamp(20px,3.5vw,26px);font-weight:700}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--neon)}
.mono{font-family:var(--f-mono)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
[hidden]{display:none!important}

/* topo */
.topo{display:flex;align-items:center;gap:14px;padding:6px 0 18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 18px var(--f-tit);text-decoration:none}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--neon),var(--roxo));display:grid;place-items:center;color:#06101f;font:700 13px var(--f-mono);font-style:normal}
.nav{margin-left:auto;display:flex;gap:4px;background:var(--bancada);border:1px solid var(--borda);border-radius:999px;padding:4px}
.nav a{padding:8px 14px;border-radius:999px;text-decoration:none;font:600 13px var(--f-txt);color:var(--fg2);min-height:36px;display:flex;align-items:center}
.nav a.on{background:var(--neon);color:#06101f}
@media(max-width:560px){.nav{margin-left:0;width:100%;justify-content:space-between}.nav a{padding:8px 10px;font-size:12px;flex:1;justify-content:center}}

/* painel de status */
.status{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:22px}
@media(max-width:720px){.status{grid-template-columns:1fr}}
.card{background:var(--bancada);border:1px solid var(--borda);border-radius:16px;padding:18px}
.card.neon{border-color:rgb(76 201 255/.45);box-shadow:0 0 0 1px rgb(76 201 255/.15),0 20px 60px -30px rgb(76 201 255/.5)}
.prog-big{display:flex;align-items:baseline;gap:10px;margin:10px 0 8px}
.prog-big b{font:800 56px/1 var(--f-tit);color:var(--neon2);font-variant-numeric:tabular-nums}
.prog-big span{color:var(--fg2)}
.trilho{height:10px;border-radius:5px;background:#0a0f1d;border:1px solid var(--borda);overflow:hidden;position:relative}
.trilho i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--neon),var(--verde));box-shadow:0 0 14px var(--neon)}
.continuar{display:flex;align-items:center;gap:14px;text-decoration:none;margin-top:14px;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,#0d3a55,#13223f);border:1px solid rgb(76 201 255/.5)}
.continuar .play{width:44px;height:44px;border-radius:50%;background:var(--neon);color:#06101f;display:grid;place-items:center;flex:none}
.continuar b{display:block;font:700 17px var(--f-tit)}
.continuar small{color:var(--fg2)}
.continuar .seta{margin-left:auto;color:var(--neon2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:#0a0f1d;border:1px solid var(--borda);border-radius:12px;padding:12px;display:grid;gap:4px}
.kpi b{font:700 24px/1 var(--f-tit);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--fg2)}
.kpi.verde b{color:var(--verde)}.kpi.ambar b{color:var(--ambar)}.kpi.rosa b{color:var(--rosa)}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 8px var(--verde);margin-right:6px;vertical-align:middle}

/* a sala */
.sala{display:grid;gap:14px}
.zona{border:1px dashed var(--borda-forte);border-radius:18px;padding:16px;position:relative;background:linear-gradient(180deg,rgb(255 255 255/.02),transparent)}
.zona-cab{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.zona-cab .eyebrow{color:var(--fg3)}
.zona-cab h2{font-size:18px}
.zona-cab small{margin-left:auto;color:var(--fg2);font:500 12px var(--f-mono)}
.estacoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.est{position:relative;text-align:left;display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--piso);border:1px solid var(--borda);transition:transform .18s,border-color .18s,box-shadow .18s;--c:var(--neon)}
.est:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 14px 40px -20px var(--c)}
.est.atual{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 30px -10px var(--c)}
.est.tranc{opacity:.55}
.monitor{aspect-ratio:16/9;max-width:100%;border-radius:8px;background:#05070e;border:2px solid #1b2440;position:relative;overflow:hidden;display:grid;place-items:end start;padding:8px}
.monitor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgb(255 255 255/.03) 0 1px,transparent 1px 3px)}
.monitor .tela{position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,transparent),transparent 70%);opacity:var(--on,0)}
.monitor .cod{position:relative;font:600 10px/1.5 var(--f-mono);color:var(--c);opacity:.95;white-space:pre}
.monitor .pct{position:absolute;top:6px;right:8px;font:700 11px var(--f-mono);color:var(--c)}
.est h3{font-size:16px;font-weight:700;line-height:1.2}
.est .meta{font:500 12px var(--f-mono);color:var(--fg2);display:flex;justify-content:space-between}
.est .leds{display:flex;gap:3px;flex-wrap:wrap}
.est .leds i{width:8px;height:8px;border-radius:2px;background:#1b2440}
.est .leds i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.est .leds i.half{background:color-mix(in srgb,var(--c) 45%,#1b2440)}
.tag-aqui{position:absolute;top:-10px;left:12px;background:var(--c);color:#06101f;font:700 10px/1 var(--f-mono);letter-spacing:.1em;padding:5px 8px;border-radius:999px;text-transform:uppercase}

/* estação (matéria) */
.voltar{display:inline-flex;align-items:center;gap:8px;color:var(--fg2);text-decoration:none;font-size:14px;min-height:44px}
.est-cab{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:6px 0 20px}
@media(max-width:640px){.est-cab{grid-template-columns:1fr}}
.anel{width:96px;height:96px;position:relative}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:8}
.anel .f{stroke:#1b2440}.anel .v{stroke:var(--c);stroke-linecap:round;filter:drop-shadow(0 0 6px var(--c))}
.anel b{position:absolute;inset:0;display:grid;place-items:center;font:800 20px var(--f-tit)}
.rack{display:grid;gap:10px}
.bloco{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:14px;background:var(--bancada);border:1px solid var(--borda);text-align:left;width:100%}
.bloco .num{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font:700 14px var(--f-mono);background:#0a0f1d;border:1px solid var(--borda);color:var(--fg2)}
.bloco.feito .num{background:var(--verde);color:#06101f;border-color:var(--verde)}
.bloco.atual{border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.bloco.atual .num{background:var(--c);color:#06101f;border-color:var(--c)}
.bloco.tranc{opacity:.5}
.bloco h3{font-size:17px}
.bloco small{display:block;color:var(--fg2);font-size:13px;margin-top:2px}
.bloco .leds{display:flex;gap:3px;justify-self:end}
.bloco .leds i{width:10px;height:5px;border-radius:2px;background:#1b2440}
.bloco .leds i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.bloco .virada{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ambar);margin-left:8px}
.aberto{grid-column:1/-1;padding:4px 0 2px 66px;display:grid;gap:12px}
@media(max-width:640px){.aberto{padding-left:0}}
.conceitos{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.conc{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:#0a0f1d;border:1px solid var(--borda);font:500 13px var(--f-mono);min-height:44px;text-align:left}
.conc i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 10px var(--f-mono);font-style:normal;border:1px solid var(--borda);color:var(--fg2);flex:none}
.conc.feito i{background:var(--verde);border-color:var(--verde);color:#06101f}
.conc.atual{border-color:var(--c)}.conc.atual i{border-color:var(--c);color:var(--c)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--borda-forte);background:transparent;font:700 14px var(--f-tit);text-decoration:none}
.btn.p{background:var(--c,var(--neon));color:#06101f;border-color:transparent}

/* aula */
.aula-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:10px 0 8px;border-bottom:1px solid var(--borda)}
.aula-linha{display:flex;align-items:center;gap:12px}
.aula-linha .x{width:40px;height:40px;border-radius:10px;border:1px solid var(--borda);display:grid;place-items:center;text-decoration:none;color:var(--fg2)}
.aula-linha .onde{flex:1;min-width:0}
.aula-linha .onde b{display:block;font:700 15px var(--f-tit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aula-linha .onde small{color:var(--fg2);font-size:12px}
.passos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.passos button{border:0;background:none;padding:6px 0;display:grid;gap:6px;text-align:left;font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.passos button i{display:block;height:4px;border-radius:2px;background:#1b2440}
.passos button.on{color:var(--neon)}.passos button.on i{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.passos button.ok{color:var(--verde)}.passos button.ok i{background:var(--verde)}
.aula{display:grid;gap:18px;padding-top:20px;max-width:720px}
.aula p{margin:0;font-size:17px;line-height:1.55}
.aula .lede{font-size:19px;color:var(--fg2)}
.quadro{border-radius:16px;border:1px solid var(--borda);background:var(--bancada);overflow:hidden}
.quadro .cab{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--borda);font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg2)}
.quadro .cab::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rosa);box-shadow:18px 0 0 var(--ambar),36px 0 0 var(--verde);margin-right:30px}
.codigo{margin:0;padding:14px 16px;font:14px/1.7 var(--f-mono);overflow-x:auto;counter-reset:l}
.codigo .l{display:block;position:relative;padding:2px 8px 2px 34px;border-radius:6px;transition:background .2s;white-space:pre}
.codigo .l::before{counter-increment:l;content:counter(l);color:var(--fg3);position:absolute;left:8px;width:14px;text-align:right}
.codigo .l.on{background:rgb(76 201 255/.14);box-shadow:inset 3px 0 0 var(--neon)}
.codigo .l.ok{color:var(--fg2)}
.k{color:var(--roxo)}.s{color:var(--verde)}.n{color:var(--ambar)}.c{color:var(--fg3)}
.saida{border-top:1px solid var(--borda);padding:12px 16px;font:13px var(--f-mono);display:grid;gap:4px}
.saida small{color:var(--fg3);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.ctrl{display:flex;align-items:center;gap:8px;padding:12px 14px;border-top:1px solid var(--borda)}
.ctrl button{min-height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--borda-forte);background:transparent;font:700 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.ctrl button.p{background:var(--neon);color:#06101f;border-color:transparent}
.ctrl .pts{margin-left:auto;display:flex;gap:5px}.ctrl .pts i{width:7px;height:7px;border-radius:50%;background:#1b2440}.ctrl .pts i.on{background:var(--neon)}
.nota{padding:12px 16px;border-top:1px solid var(--borda);color:var(--fg2);font-size:15px;min-height:52px}
.nota b{color:var(--fg)}
.dia{display:grid;grid-template-columns:48px 1fr;gap:14px;padding:16px;border-radius:14px;background:linear-gradient(135deg,rgb(255 181 71/.12),transparent);border:1px solid rgb(255 181 71/.35)}
.dia .ic{width:48px;height:48px;border-radius:12px;background:rgb(255 181 71/.2);display:grid;place-items:center;color:var(--ambar)}
.dia b{display:block;font:700 15px var(--f-tit);color:var(--ambar);margin-bottom:2px}
.pergunta{display:grid;gap:10px}
.pergunta h2{font-size:22px}
.op{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;border:1px solid var(--borda);background:var(--bancada);text-align:left;width:100%;font:16px var(--f-txt);transition:border-color .15s}
.op:hover{border-color:var(--borda-forte)}
.op i{font:700 12px var(--f-mono);font-style:normal;width:26px;height:26px;border-radius:7px;border:1px solid var(--borda-forte);display:grid;place-items:center;flex:none;color:var(--fg2)}
.op.certa{border-color:var(--verde);background:rgb(57 229 140/.08)}.op.certa i{background:var(--verde);color:#06101f;border-color:var(--verde)}
.op.errada{border-color:var(--rosa);background:rgb(255 110 168/.08)}.op.errada i{background:var(--rosa);color:#06101f;border-color:var(--rosa)}
.retorno{padding:14px 16px;border-radius:12px;border:1px solid var(--verde);background:rgb(57 229 140/.08);font-size:15px;line-height:1.5}
.retorno.erro{border-color:var(--rosa);background:rgb(255 110 168/.08)}
.retorno b{display:block;font-family:var(--f-tit)}
.pe{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--borda);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pe > div{max-width:720px;margin:0 auto;display:grid;grid-template-columns:48px 1fr;gap:10px}
.pe button{min-height:52px;border-radius:12px;border:1px solid var(--borda-forte);background:transparent;font:800 14px var(--f-tit);letter-spacing:.02em}
.pe .p{background:var(--neon);color:#06101f;border-color:transparent;box-shadow:0 10px 30px -12px var(--neon)}
.pe .p:disabled{background:var(--bancada);color:var(--fg3);box-shadow:none;cursor:not-allowed}
.selo{width:96px;height:96px;border-radius:50%;border:3px solid var(--verde);display:grid;place-items:center;font:800 28px var(--f-tit);color:var(--verde);margin:10px auto 0;box-shadow:0 0 30px -8px var(--verde)}
.proximo{display:grid;gap:4px;padding:16px;border-radius:14px;background:var(--bancada);border:1px solid var(--borda)}
.proximo span{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg2)}
.proximo b{font:700 18px var(--f-tit)}

/* diagnóstico */
.diag{display:grid;gap:12px;max-width:820px}
.d{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px;border-radius:14px;background:var(--bancada);border:1px solid var(--borda)}
.d .n{width:44px;height:44px;border-radius:10px;background:#0a0f1d;border:1px solid var(--borda);display:grid;place-items:center;font:700 14px var(--f-mono);color:var(--rosa)}
.d h3{font-size:16px;margin-bottom:6px}
.d .par{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
@media(max-width:560px){.d .par{grid-template-columns:1fr}}
.d .par > div{padding:10px 12px;border-radius:10px;background:#0a0f1d;border:1px solid var(--borda)}
.d .par span{display:block;font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.d .antes span{color:var(--rosa)}.d .depois span{color:var(--verde)}
.d .ref{margin-top:8px;font:500 12px var(--f-mono);color:var(--fg3)}
.d .ref a{color:var(--neon2)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="topo">
    <a class="logo" href="#sala"><i>&gt;_</i>Domínio</a>
    <nav class="nav" aria-label="Protótipo">
      <a href="#sala" data-nav="sala">Sala</a><a href="#estacao-LOG" data-nav="estacao">Estação</a><a href="#aula" data-nav="aula">Aula</a><a href="#diagnostico" data-nav="diagnostico">Diagnóstico</a>
    </nav>
  </header>

</div>

:"NSQ.03","n":"Colunar e análise","k":["armazenamento por linha e por coluna","compressão","Parquet","DuckDB consultando arquivo direto"],"v":false},{"c":"NSQ.04","n":"Chave-valor e cache","k":["Redis","expiração","contadores","quando usar cache"],"v":false},{"c":"NSQ.05","n":"Coluna larga e grafo","k":["Cassandra (conceito)","Neo4j e consultas de caminho (conceito)"],"v":false},{"c":"NSQ.06","n":"Big data","k":["volume, velocidade e variedade","processamento distribuído","MapReduce","Spark e DataFrames distribuídos (conceito)","data lake e lakehouse"],"v":false},{"c":"NSQ.07","n":"Fluxos","k":["dado em lote e em fluxo","fila de mensagens (conceito: Kafka)","janela de tempo"],"v":false}]},{"s":"ETI","n":"Ética, privacidade e governança","p":2,"e":"Cuidar dos dados","mods":[{"c":"ETI.01","n":"LGPD","k":["dado pessoal e dado pessoal sensível","bases legais","direitos do titular","papéis (controlador, operador, encarregado)"],"v":false},{"c":"ETI.02","n":"Anonimização","k":["anonimização e pseudonimização","reidentificação por cruzamento","agregação mínima"],"v":false},{"c":"ETI.03","n":"Segurança de dados","k":["confidencialidade, integridade e disponibilidade","criptografia simétrica e assimétrica","hash","controle de acesso","segredos fora do código"],"v":false},{"c":"ETI.04","n":"Viés e justiça","k":["viés na coleta, no rótulo e no modelo","métricas de justiça (conceito)","impacto de decisões automáticas"],"v":false},{"c":"ETI.05","n":"Governança e qualidade","k":["dimensões de qualidade (completude, exatidão, consistência, atualidade)","metadados","dicionário de dados","linhagem","dono do dado","DAMA-DMBOK (conceito)"],"v":false},{"c":"ETI.06","n":"Reprodutibilidade","k":["semente aleatória","versão de dados e código","registro de decisões"],"v":false}]}];
const ZONAS = [
  ["Pensar como programador","LOG","PY"],["Onde os dados moram","BD","CMP"],["Números com sentido","MAT","EST"],
  ["Programar de verdade","ED","POO","ENG"],["Da planilha ao gráfico","FMT","AD","VIS"],["Modelos e mundo real","ALC","ML","NSQ","ETI"]];
const COR = {LOG:"#4cc9ff",PY:"#ffd166",BD:"#39e58c",CMP:"#9aa6c8",MAT:"#9d7bff",EST:"#ff6ea8",ED:"#4cc9ff",POO:"#ffb547",ENG:"#39e58c",FMT:"#8ee3ff",AD:"#ffd166",VIS:"#ff6ea8",ALC:"#9d7bff",ML:"#39e58c",NSQ:"#ffb547",ETI:"#9aa6c8"};
const POR = Object.fromEntries(MAT.map(m=>[m.s,m]));
// progresso de exemplo: LOG dominada em parte, PY começada (dados fictícios para o protótipo)
let prog; try{prog=JSON.parse(localStorage.getItem("sala-proto:v1"))}catch(e){} 
prog = prog || {feitos:{"LOG.01":5,"LOG.02":6,"LOG.03":5,"LOG.04":2}, atual:"LOG.04"};
const salvar=()=>{try{localStorage.setItem("sala-proto:v1",JSON.stringify(prog))}catch(e){}};
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const feitosDe=c=>prog.feitos[c]||0;
const modOk=m=>feitosDe(m.c)>=m.k.length;
const pctMat=m=>{const t=m.mods.reduce((a,x)=>a+x.k.length,0),f=m.mods.reduce((a,x)=>a+Math.min(x.k.length,feitosDe(x.c)),0);return Math.round(100*f/t)};
const formacao=()=>MAT.reduce((a,m)=>a+m.p*pctMat(m)/100,0);
const tela=document.getElementById("tela"), pe=document.getElementById("pe");
const matDoAtual=()=>MAT.find(m=>m.mods.some(x=>x.c===prog.atual));
const modAtual=()=>matDoAtual().mods.find(x=>x.c===prog.atual);

function vSala(){
  pe.hidden=true;
  const m=matDoAtual(), mod=modAtual(), f=formacao();
  const nMods=MAT.reduce((a,x)=>a+x.mods.filter(modOk).length,0);
  const zonas=ZONAS.map(([nome,...sg],zi)=>{
    const ms=sg.map(s=>POR[s]);
    const feitos=ms.reduce((a,x)=>a+x.mods.filter(modOk).length,0), tot=ms.reduce((a,x)=>a+x.mods.length,0);
    const est=ms.map(x=>{
      const p=pctMat(x), aqui=x===m, idx=MAT.indexOf(x), tranc=p===0&&!aqui;
      const leds=x.mods.map(y=>`<i class="${modOk(y)?"on":feitosDe(y.c)?"half":""}"></i>`).join("");
      const linha=x.mods.find(y=>!modOk(y))||x.mods[x.mods.length-1];
      return `<button class="est ${aqui?"atual":""} ${tranc?"tranc":""}" style="--c:${COR[x.s]};--on:${Math.max(.15,p/100)}" data-ir="#estacao-${x.s}">
        ${aqui?`<span class="tag-aqui">você está aqui</span>`:""}
        <span class="monitor"><span class="tela"></span><span class="pct">${p}%</span><span class="cod">${esc(x.s.toLowerCase())}&gt; ${esc(linha.n.toLowerCase().slice(0,22))}\n${p?"_":"// aguardando"}</span></span>
        <h3>${String(idx+1).padStart(2,"0")} · ${esc(x.n)}</h3>
        <span class="leds" aria-hidden="true">${leds}</span>
        <span class="meta"><span>${x.mods.filter(modOk).length}/${x.mods.length} módulos</span><span>vale ${x.p}%</span></span>
      </button>`}).join("");
    return `<section class="zona"><div class="zona-cab"><span class="eyebrow">Bancada ${zi+1}</span><h2>${nome}</h2><small>${feitos}/${tot} módulos</small></div><div class="estacoes">${est}</div></section>`;
  }).join("");
  tela.innerHTML=`
  <section class="status">
    <div class="card neon"><span class="eyebrow">Formação de cientista de dados</span>
      <div class="prog-big"><b>${f.toLocaleString("pt-BR",{maximumFractionDigits:1})}%</b><span>${nMods} de ${MAT.reduce((a,x)=>a+x.mods.length,0)} módulos ligados</span></div>
      <div class="trilho"><i style="width:${f}%"></i></div>
      <a class="continuar" href="#aula"><span class="play">&#9654;</span><span><b>${esc(mod.n)}</b><small>${esc(m.n)} · conceito ${Math.min(mod.k.length,feitosDe(mod.c)+1)} de ${mod.k.length}</small></span><span class="seta">&#8594;</span></a>
    </div>
    <div class="card"><span class="eyebrow" style="color:var(--fg3)">Hoje</span>
      <div class="kpis" style="margin-top:10px"><div class="kpi verde"><b>7</b><span><span class="led"></span>dias seguidos</span></div><div class="kpi ambar"><b>3</b><span>revisões hoje</span></div><div class="kpi rosa"><b>12</b><span>min por conceito</span></div></div>
      <p style="margin:14px 0 0;color:var(--fg2);font-size:14px">Cada estação acende com os módulos dominados. Toque numa para abrir a bancada.</p>
    </div>
  </section>
  <div class="sala">${zonas}</div>`;
}

function vEstacao(sig){
  pe.hidden=true;
  const m=POR[sig]||POR.LOG, p=pctMat(m), c=COR[m.s], i=MAT.indexOf(m);
  const prox=m.mods.find(x=>!modOk(x))||m.mods[0];
  const r=42, volta=2*Math.PI*r;
  const blocos=m.mods.map((x,k)=>{
    const ok=modOk(x), atual=x===prox, fe=feitosDe(x.c), tranc=!ok&&!atual&&fe===0;
    const leds=x.k.map((_,j)=>`<i class="${j<fe?"on":""}"></i>`).join("");
    const conceitos=x.k.map((n,j)=>`<span class="conc ${j<fe?"feito":j===fe?"atual":""}"><i>${j<fe?"&#10003;":j+1}</i>${esc(cap(n))}</span>`).join("");
    return `<button class="bloco ${ok?"feito":atual?"atual":tranc?"tranc":""}" data-abrir="${x.c}" aria-expanded="${atual}">
      <span class="num">${ok?"&#10003;":String(k+1).padStart(2,"0")}</span>
      <span><h3>${esc(x.n)}${x.v?`<span class="virada">virada</span>`:""}</h3><small>${x.k.length} conceitos${ok?" · dominado":fe?` · ${fe} feitos`:""}</small></span>
      <span class="leds" aria-hidden="true">${leds}</span>
      ${atual?`<span class="aberto"><span class="conceitos">${conceitos}</span><span><a class="btn p" href="#aula">Continuar a aula &#8594;</a></span></span>`:""}
    </button>`}).join("");
  tela.innerHTML=`<div style="--c:${c}">
    <a class="voltar" href="#sala">&#8592; Sala de programação</a>
    <div class="est-cab">
      <div><span class="eyebrow">Estação ${String(i+1).padStart(2,"0")} · vale ${m.p}% da formação</span><h1 style="margin-top:6px">${esc(m.n)}</h1><p style="margin:8px 0 0;color:var(--fg2)">${m.mods.filter(modOk).length} de ${m.mods.length} módulos dominados. ${m.e?`No trabalho: ${esc(m.e.toLowerCase())}.`:""}</p></div>
      <div class="anel"><svg viewBox="0 0 100 100"><circle class="f" cx="50" cy="50" r="${r}"/><circle class="v" cx="50" cy="50" r="${r}" stroke-dasharray="${volta.toFixed(1)}" stroke-dashoffset="${(volta*(1-p/100)).toFixed(1)}"/></svg><b>${p}%</b></div>
    </div>
    <div class="rack">${blocos}</div></div>`;
  tela.querySelectorAll("[data-abrir]").forEach(b=>b.addEventListener("click",e=>{ if(e.target.closest("a"))return; const x=m.mods.find(y=>y.c===b.dataset.abrir); if(modOk(x)||feitosDe(x.c)||x===prox){prog.atual=x.c;salvar();vEstacao(sig)} }));
}

/* a aula: um conceito em 4 tempos, com o código que acende linha a linha */
const PASSOS=["Veja","Exemplo","Pratique","Avance"];
const LINHAS=[["<span class=k>def</span> pix(saldo, valor):",""],["    <span class=k>if</span> valor &gt; saldo:","1. Antes de mandar, o app confere: cabe no saldo?"],["        <span class=k>return</span> <span class=s>\"saldo insuficiente\"</span>","2. Se não cabe, para aqui e avisa. Nada é enviado."],["    saldo = saldo - valor","3. Se cabe, desconta. Cada passo é claro: ninguém faz 'mais ou menos'."],["    <span class=k>return</span> saldo","4. Devolve o saldo novo. Todo algoritmo termina com um resultado."],["<span class=k>print</span>(pix(<span class=n>120</span>, <span class=n>80</span>))","5. Rodando com 120 e 80: 80 cabe em 120, desconta, sobra 40."]];
let aula={p:0,l:0,resp:null};
function vAula(){
  pe.hidden=false;
  const m=matDoAtual(), mod=modAtual(), nconc=mod.k.length, kc=Math.min(nconc-1,feitosDe(mod.c));
  const corpo = aula.p===0 ? `
    <h1>O que é um algoritmo</h1>
    <p class="lede">Uma sequência de passos claros, que qualquer pessoa segue do mesmo jeito e que sempre termina com um resultado.</p>
    <div class="quadro"><div class="cab">pix.py · veja acontecer</div>
      <pre class="codigo">${LINHAS.map((l,i)=>`<span class="l ${i===aula.l?"on":i<aula.l?"ok":""}">${l[0]}</span>`).join("\n")}</pre>
      <div class="nota">${aula.l?LINHAS[aula.l][1]:"<b>Toque em Passo.</b> Cada linha acende na ordem em que o computador a executa."}</div>
      ${aula.l===LINHAS.length-1?`<div class="saida"><small>saída</small><span>40</span></div>`:""}
      <div class="ctrl"><button type="button" data-l="-1">&#8592;</button><button type="button" class="p" data-l="1">Passo &#8594;</button><span class="pts">${LINHAS.map((_,i)=>`<i class="${i<=aula.l?"on":""}"></i>`).join("")}</span></div>
    </div>
    <div class="dia"><span class="ic">&#9679;</span><div><b>No dia a dia</b>"Asse por 40 minutos a 180 graus" é um passo de algoritmo. "Asse até ficar bom" não é: depende de quem decide.</div></div>`
  : aula.p===1 ? `
    <span class="eyebrow">Exemplo resolvido</span><h2>Quanto sobra depois de dois Pix?</h2>
    <p>Saldo 200. Você manda 150 e depois tenta mandar 80.</p>
    <div class="quadro"><div class="cab">passo a passo</div>
      <pre class="codigo"><span class="l ok">saldo = pix(<span class=n>200</span>, <span class=n>150</span>)   <span class=c># 150 cabe em 200 → sobra 50</span></span>
<span class="l ok">saldo = pix(saldo, <span class=n>80</span>)   <span class=c># 80 não cabe em 50 → "saldo insuficiente"</span></span></pre>
      <div class="nota"><b>Por que a segunda falha?</b> A conferência vem antes do desconto. É a ordem dos passos que protege o saldo.</div></div>
    <div class="pergunta"><h2 style="font-size:18px">Autoexplicação: o que a linha 2 garante?</h2>
      ${opcoes([["Que nunca se envia mais do que se tem",true,"É a regra do algoritmo: conferir antes de agir."],["Que o Pix é mais rápido",false,"Velocidade não entra aqui; a linha só compara dois números."],["Que o saldo nunca muda",false,"Ele muda na linha 4, quando o valor cabe."]])}</div>`
  : aula.p===2 ? `
    <span class="eyebrow">Pratique · 1 de 3</span><h2>Qual destes é um passo de algoritmo?</h2>
    <div class="pergunta">${opcoes([["Some 10% ao valor da conta.",true,"Tem um único jeito de fazer: qualquer pessoa chega ao mesmo número."],["Dê uma gorjeta justa.",false,"\"Justa\" depende de quem decide. Um algoritmo não deixa escolha ambígua."],["Pague quando achar melhor.",false,"\"Quando achar melhor\" não diz quando. Um passo precisa ser preciso."]])}</div>`
  : `
    <div class="selo">3/3</div><h2 style="text-align:center">Conceito ligado</h2>
    <div class="quadro"><div class="nota" style="border:0"><b>Leve daqui</b>Algoritmo: passos claros, sem ambiguidade, que sempre terminam com um resultado.</div></div>
    <div class="proximo"><span>A seguir · conceito ${Math.min(nconc,kc+2)} de ${nconc}</span><b>${esc(cap(mod.k[Math.min(nconc-1,kc+1)]))}</b></div>
    <p style="text-align:center;color:var(--fg2);font-size:14px">O que você errou volta na revisão de amanhã, misturado com outras matérias.</p>`;
  tela.innerHTML=`
    <div class="aula-top"><div class="aula-linha"><a class="x" href="#estacao-${m.s}" aria-label="Sair">&#10005;</a><div class="onde"><b>${esc(cap(mod.k[kc]))}</b><small>${esc(mod.n)} · conceito ${kc+1} de ${nconc}</small></div></div>
      <div class="passos">${PASSOS.map((n,i)=>`<button type="button" data-p="${i}" class="${i===aula.p?"on":i<aula.p?"ok":""}"><i></i>${i+1} ${n}</button>`).join("")}</div></div>
    <div class="aula">${corpo}</div>`;
  tela.querySelectorAll("[data-l]").forEach(b=>b.addEventListener("click",()=>{aula.l=Math.max(0,Math.min(LINHAS.length-1,aula.l+Number(b.dataset.l)));vAula()}));
  tela.querySelectorAll("[data-p]").forEach(b=>b.addEventListener("click",()=>{const k=Number(b.dataset.p); if(k<=aula.p){aula.p=k;aula.resp=null;vAula()}}));
  tela.querySelectorAll("[data-op]").forEach(b=>b.addEventListener("click",()=>{aula.resp=Number(b.dataset.op);vAula()}));
  const ir=document.getElementById("pe-ir");
  const pronto = aula.p===0 ? aula.l===LINHAS.length-1 : aula.p===3 ? true : aula.resp!=null && JSON.parse(tela.querySelector("[data-op]").dataset.ops)[aula.resp][1];
  ir.disabled=!pronto;
  ir.textContent=["Ir para o exemplo","Ir para a prática","Concluir o conceito","Próximo conceito"][aula.p];
  ir.onclick=()=>{ if(aula.p<3){aula.p++;aula.resp=null;vAula()} else { prog.feitos[mod.c]=Math.min(nconc,feitosDe(mod.c)+1); if(modOk(mod)){const i=m.mods.indexOf(mod); prog.atual=(m.mods[i+1]||mod).c} salvar(); aula={p:0,l:0,resp:null}; location.hash="#estacao-"+m.s } };
  document.getElementById("pe-voltar").onclick=()=>{ if(aula.p>0){aula.p--;aula.resp=null;vAula()} };
  window.scrollTo(0,0);
}
function opcoes(ops){
  const r=aula.resp;
  return ops.map((o,i)=>`<button type="button" class="op ${r===i?(o[1]?"certa":"errada"):""}" data-op="${i}" data-ops='${JSON.stringify(ops).replace(/'/g,"&#39;")}'><i>${"ABC"[i]}</i><span>${o[0]}</span></button>`).join("")
   + (r!=null?`<div class="retorno ${ops[r][1]?"":"erro"}"><b>${ops[r][1]?"Certo.":"Ainda não."}</b>${ops[r][2]}${ops[r][1]?"":" Tente outra."}</div>`:"");
}

function rota(){
  const h=location.hash||"#sala";
  document.querySelectorAll("[data-nav]").forEach(a=>a.classList.toggle("on",h.startsWith("#"+a.dataset.nav)));
  if(h.startsWith("#estacao-")) vEstacao(h.slice(9));
  else if(h==="#aula") vAula();
  else if(h==="#diagnostico") vDiag();
  else vSala();
  if(h!=="#aula") window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ir]"); if(b){location.hash=b.dataset.ir}});
window.addEventListener("hashchange",rota); rota();
