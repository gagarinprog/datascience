plugins { id "com.android.application" }
android {
  namespace "br.dominio.app"
  compileSdk 34
  defaultConfig { applicationId "br.dominio.app"; minSdk 26; targetSdk 34; versionCode 2; versionName "1.1" }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
  androidResources { noCompress += ["wasm", "whl", "zip", "data", "woff2", "png"] }
  lint { checkReleaseBuilds false; abortOnError false }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
